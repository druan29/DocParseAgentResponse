<!-- templates/error.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            max-width: 600px;
            width: 100%;
        }
        h1 {
            color: #ef4444;
            margin-bottom: 20px;
        }
        .error-icon {
            font-size: 64px;
            text-align: center;
            margin-bottom: 20px;
        }
        .error-message {
            background: #fee2e2;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 15px;
            color: #991b1b;
        }
        .details {
            background: #f3f4f6;
            padding: 15px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 12px;
            color: #374151;
            overflow-x: auto;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 14px;
            margin-top: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-align: center;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="error-icon">⚠️</div>
        <h1>Processing Error</h1>
        <div class="error-message">
            <strong>{{ error }}</strong>
        </div>
        {% if details %}
        <div class="details">{{ details }}</div>
        {% endif %}
        <a href="/" class="btn">Try Again</a>
    </div>
</body>
</html>
